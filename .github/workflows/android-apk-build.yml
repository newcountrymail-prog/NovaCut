name: Android APK Automation Build

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x gradlew

      - name: Build Android Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Detect and Collect APK Output
        id: find_apk
        run: |
          mkdir -p build-output/apk
          echo "Searching for generated APK files..."
          FOUND_APKS=$(find . -type f -name "*.apk" ! -path "*/intermediates/*")
          if [ -z "$FOUND_APKS" ]; then
            echo "Error: No APK files were generated!"
            exit 1
          fi
          echo "Found APKs:"
          echo "$FOUND_APKS"
          for apk in $FOUND_APKS; do
            cp "$apk" build-output/apk/
          done
          ls -la build-output/apk/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaCut-Android-Debug-APK
          path: build-output/apk/*.apk
          retention-days: 30

      - name: Preserve Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-failure-logs
          path: |
            **/build/reports/
            **/build/outputs/logs/
          retention-days: 7

      - name: Publish GitHub Release (Version Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/apk/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
